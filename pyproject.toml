[project]
name = "daguerres-hoard"
version = "0.1.0"
description = "A private, local photo library that understands what is in your pictures."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
urls = { Repository = "https://github.com/Luissalet/DaguerresHoard" }
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "httpx==0.28.1",
    "pillow==10.4.0",
    "numpy==2.2.1",
    "mcp==1.9.4",
    "fastembed==0.7.1",
    "onnxruntime==1.20.1",
    "pillow-heif==0.21.0",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.1",
]

[project.scripts]
daguerre-hoard = "daguerre_hoard.runtime_entry:app_main"
daguerre-mcp = "daguerre_hoard.runtime_entry:mcp_main"

[build-system]
requires = ["setuptools>=68", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["daguerre_hoard*"]
namespaces = false
exclude = ["*.tests*", "*.scripts*"]

[tool.setuptools.cmdclass]
build_py = "build_support.StudioBuild"
bdist_wheel = "build_support.StudioWheel"

[tool.setuptools.package-data]
"daguerre_hoard.data" = ["*.tsv"]
"daguerre_hoard" = ["*-catalog.json", "studio_ui/*.html", "studio_ui/*.js", "studio_ui/*.css", "studio_ui/fonts/*"]
"daguerre_hoard.hoard_link" = ["ui/*", "ui/**/*", "web/*", "web/**/*", "_data/*", "_data/**/*", "LICENSE", "VENDORED.txt"]
"daguerre_hoard.studio_native.durer" = ["mcp-catalog.json", "native-catalog.json", "INCORPORATION.json", "LICENSE", "native/bin/*"]
"daguerre_hoard.studio_native.durer.durer_hoard" = ["static/*"]
