[project]
name = "argus-hoard"
version = "0.1.0"
description = "A private, local photo library that understands what is in your pictures."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "httpx==0.28.1",
    "pillow==10.4.0",
    "imagehash==4.3.1",
    "numpy==2.2.1",
    "mcp==1.9.4",
    "fastembed==0.7.1",
    "onnxruntime==1.20.1",
    "pillow-heif==0.21.0; sys_platform != 'never'",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["argus_hoard*"]

[tool.setuptools.package-data]
"argus_hoard.data" = ["*.tsv"]
