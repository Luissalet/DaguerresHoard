[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "durers-hoard"
version = "0.1.0"
description = "A local vector illustration workspace with an owned engine and desktop editor"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "mcp>=1.20,<2", "python-multipart>=0.0.9", "Pillow>=10,<14", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
durer-hoard = "durer_hoard.__main__:main"

[tool.setuptools]
packages = ["durer_hoard"]
include-package-data = true

[tool.setuptools.package-data]
durer_hoard = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
