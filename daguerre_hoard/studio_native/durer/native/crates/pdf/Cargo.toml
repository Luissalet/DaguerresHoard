[package]
name = "durer-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Dürer PDF export and import"

[lints]
workspace = true

[dependencies]
durer-geom = { workspace = true }
durer-doc = { workspace = true }
durer-effects = { workspace = true }
durer-brush = { workspace = true }
durer-color = { workspace = true }
durer-text = { workspace = true }
kurbo = { workspace = true }
thiserror = { workspace = true }
flate2 = { workspace = true }
image = { workspace = true }
krilla = { workspace = true }
hayro-syntax = "0.7.2"
hayro-interpret = { version = "0.7.0", default-features = false, features = ["embed-fonts"] }
log = { workspace = true }
smallvec = "1"
serde = { workspace = true }
# PDF security (encrypt.rs): pure Rust, MIT OR Apache-2.0, builds for wasm.
aes = "0.8"
md-5 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
durer-testkit = { workspace = true }
serde_json = { workspace = true }
