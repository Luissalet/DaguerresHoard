[package]
name = "daguerre-layers-psd"
description = "Faithful, lossless reader and writer for Adobe Photoshop PSD (v1) and PSB (v2) files"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "daguerre_layers_psd"
path = "src/lib.rs"

[features]
default = []
serde = ["dep:serde"]
testgen = []

[dependencies]
thiserror = { workspace = true }
flate2 = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
daguerre-layers-psd = { path = ".", features = ["testgen"] }

[lints]
workspace = true
