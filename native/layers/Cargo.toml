[workspace]
resolver = "3"
members = ["crates/*", "apps/daguerre-layers", "apps/daguerre-layers-cli"]
default-members = ["apps/daguerre-layers-cli", "apps/daguerre-layers"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
# internal
daguerre-layers-geom = { path = "crates/geom" }
daguerre-layers-color = { path = "crates/color" }
daguerre-layers-cms = { path = "crates/cms" }
daguerre-layers-raster = { path = "crates/raster" }
daguerre-layers-doc = { path = "crates/doc" }
daguerre-layers-ops = { path = "crates/ops" }
daguerre-layers-psd = { path = "crates/psd" }
daguerre-layers-codecs = { path = "crates/codecs" }
daguerre-layers-raw = { path = "crates/raw" }
daguerre-layers-compose = { path = "crates/compose" }
daguerre-layers-gpu = { path = "crates/gpu" }
daguerre-layers-paint = { path = "crates/paint" }
daguerre-layers-algo = { path = "crates/algo" }
daguerre-layers-io = { path = "crates/io" }
daguerre-layers-text = { path = "crates/text" }
daguerre-layers-vector = { path = "crates/vector" }
daguerre-layers-format = { path = "crates/format" }
daguerre-layers-automation = { path = "crates/automation" }
daguerre-layers-plugins = { path = "crates/plugins" }
daguerre-layers-engine = { path = "crates/engine" }
daguerre-layers-ui-egui = { path = "crates/ui-egui" }
daguerre-layers-testkit = { path = "crates/testkit" }

# external
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
arc-swap = "1"
bytemuck = { version = "1", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
image = { version = "0.25", default-features = false }
proptest = "1"
eframe = { version = "0.36", default-features = false }
egui = "0.36"
egui_kittest = "0.36"
rfd = "0.17"
log = "0.4"
rayon = "1"
criterion = { version = "0.5", default-features = false }
getrandom = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
