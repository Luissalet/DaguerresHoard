[package]
name = "daguerre-layers"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "daguerre-layers"
description = "Photocraft: an open-source, native image editor"
build = "build.rs"

[lints]
workspace = true

[dependencies]
daguerre-layers-doc = { workspace = true }
daguerre-layers-color = { workspace = true }
daguerre-layers-raster = { workspace = true }
daguerre-layers-geom = { workspace = true }
daguerre-layers-compose = { workspace = true }
daguerre-layers-engine = { workspace = true }
daguerre-layers-codecs = { workspace = true }
daguerre-layers-io = { workspace = true }
daguerre-layers-format = { workspace = true }
daguerre-layers-automation = { workspace = true }
daguerre-layers-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }
arboard = "3"
open = "5"

[target.'cfg(target_os = "macos")'.dependencies]
# Finder double-click / Open With / Dock drops arrive as Apple events; this small audited crate
# registers the handler (Objective-C interop needs unsafe, which our workspace forbids) behind a
# safe API. Pinned exactly: review the diff before bumping.
fmv-macos-events = "=0.1.0"

[build-dependencies]
# Icon + VERSIONINFO for daguerre-layers.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"
