[package]
name = "daguerre-layers-cli"
description = "Headless Photocraft: convert, inspect, run commands, batch, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "daguerre_layers_cli"
path = "src/lib.rs"

[[bin]]
name = "daguerre-layers-cli"
path = "src/main.rs"

[dependencies]
daguerre-layers-automation = { path = "../../crates/automation" }
daguerre-layers-engine = { workspace = true }
daguerre-layers-io = { workspace = true }
daguerre-layers-format = { path = "../../crates/format" }
daguerre-layers-codecs = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
