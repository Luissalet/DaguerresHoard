[workspace]
resolver = "3"
members = ["crates/*", "apps/daguerre-develop", "apps/daguerre-develop-cli"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/Luissalet/DaguerresHoard"

[workspace.dependencies]
# internal
daguerre-develop-geom = { path = "crates/geom" }
daguerre-develop-sysmem = { path = "crates/sysmem" }
daguerre-develop-color = { path = "crates/color" }
daguerre-develop-raster = { path = "crates/raster" }
daguerre-develop-tiff = { path = "crates/tiff" }
daguerre-develop-raw = { path = "crates/raw" }
daguerre-develop-codecs = { path = "crates/codecs" }
daguerre-develop-meta = { path = "crates/meta" }
daguerre-develop-develop = { path = "crates/develop" }
daguerre-develop-scenes = { path = "crates/scenes" }
daguerre-develop-pipeline = { path = "crates/pipeline" }
daguerre-develop-gpu = { path = "crates/gpu" }
daguerre-develop-catalog = { path = "crates/catalog" }
daguerre-develop-preview = { path = "crates/preview" }
daguerre-develop-merge = { path = "crates/merge" }
daguerre-develop-engine = { path = "crates/engine" }
daguerre-develop-ui-egui = { path = "crates/ui-egui" }
daguerre-develop-mcp = { path = "crates/mcp" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
rayon = "1"
proptest = "1"
bytemuck = { version = "1", features = ["derive"] }
crc32fast = "1"
siphasher = "1"
libc = "0.2" # dev-only: process CPU time in benches
dhat = "0.3" # opt-in heap profiling (daguerre-develop-cli --features dhat-heap); never in default builds

# formats
quick-xml = "0.38"
miniz_oxide = "0.8"

# codecs
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp"] }
zune-jpeg = { version = "0.5", default-features = false, features = ["std", "x86", "neon"] }
zune-core = { version = "0.5", default-features = false, features = ["std"] }
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = { version = "0.7", default-features = false, features = ["std"] }
ab_glyph = { version = "0.2", default-features = false, features = ["std"] }  # Apache-2.0, pure Rust glyph rasterizer (export watermarks)
png = "0.18"
tiff = "0.11"
image-webp = "0.2"
moxcms = { version = "0.9", default-features = false, features = ["lut"] }
jxl-oxide = { version = "0.12", default-features = false }
ravif = { version = "0.13", default-features = false, features = ["threading"] } # no "asm": it needs nasm (non-Rust)

# gpu (crates/gpu; native backends only, no GL: everything stays pure Rust)
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "wgsl"] }
pollster = "1"

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
muda = { version = "0.21", default-features = false } # native menu bar (macOS: objc2/AppKit, pure Rust; no GTK)
web-time = "1"

# web (apps/daguerre-develop-web)
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
excessive_precision = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
debug = "line-tables-only"

[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
debug = false

# `cargo xtask web`: the browser build. Size matters more than build time: fat LTO, one codegen
# unit, no symbols, abort on panic (wasm32 can't unwind anyway), size-optimized code — except the
# crates that do per-pixel work, which stay at opt-level 3 (opt-level "s"/"z" there costs ~50 %/
# ~130 % render time; measured in docs/web.md → Bundle size).
[profile.web]
inherits = "release"
debug = false
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"

[profile.web.package]
daguerre-develop-pipeline = { opt-level = 3 }
daguerre-develop-raster = { opt-level = 3 }
daguerre-develop-color = { opt-level = 3 }
daguerre-develop-develop = { opt-level = 3 }
daguerre-develop-geom = { opt-level = 3 }
daguerre-develop-raw = { opt-level = 3 }
daguerre-develop-codecs = { opt-level = 3 }
daguerre-develop-scenes = { opt-level = 3 }
daguerre-develop-preview = { opt-level = 3 }
zune-jpeg = { opt-level = 3 }
zune-core = { opt-level = 3 }
jpeg-decoder = { opt-level = 3 }
jpeg-encoder = { opt-level = 3 }
png = { opt-level = 3 }
miniz_oxide = { opt-level = 3 }
