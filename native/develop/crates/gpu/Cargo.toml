[package]
name = "daguerre-develop-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Daguerre Develop GPU develop pipeline: wgpu compute (WGSL) twin of the CPU pipeline, which stays the reference (L3)"

[lints]
workspace = true

[dependencies]
daguerre-develop-geom = { workspace = true }
daguerre-develop-color = { workspace = true }
daguerre-develop-raster = { workspace = true }
daguerre-develop-develop = { workspace = true }
daguerre-develop-pipeline = { workspace = true }
log = { workspace = true }

# Native only: Metal / Vulkan / DX12 through wgpu (pure Rust; the drivers are the system's).
# The browser build keeps the CPU pipeline (WebGPU needs async device creation: see docs/gpu-pipeline.md).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true }
pollster = { workspace = true }
bytemuck = { workspace = true }

[dev-dependencies]
daguerre-develop-scenes = { workspace = true }
